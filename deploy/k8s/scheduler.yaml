apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-processing-scheduler
  namespace: dms
  labels:
    app.kubernetes.io/name: dms-v2
    app.kubernetes.io/component: processing-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dms-v2
      app.kubernetes.io/component: processing-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-v2
        app.kubernetes.io/component: processing-scheduler
    spec:
      containers:
        - name: scheduler
          image: ghcr.io/furidashidev/dms-v2:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dms-config
            - secretRef:
                name: dms-secrets
          command: ["python", "manage.py", "run_processing_role", "--role", "scheduler", "--limit", "25"]
          readinessProbe:
            exec:
              command: ["python", "manage.py", "processing_role_healthcheck", "--role", "scheduler"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["python", "manage.py", "processing_role_healthcheck", "--role", "scheduler"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
