apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-gpu-embedding-worker
  namespace: dms
  labels:
    app.kubernetes.io/name: dms-v2
    app.kubernetes.io/component: gpu-embedding-worker
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: dms-v2
      app.kubernetes.io/component: gpu-embedding-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-v2
        app.kubernetes.io/component: gpu-embedding-worker
    spec:
      nodeSelector:
        accelerator: nvidia
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: embedding-worker
          image: ghcr.io/furidashidev/dms-v2:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dms-config
            - secretRef:
                name: dms-secrets
          env:
            - name: DMS_PROCESSING_ACCELERATOR
              value: "gpu"
          command: ["python", "manage.py", "run_processing_role", "--role", "embedding-worker", "--limit", "5"]
          livenessProbe:
            exec:
              command: ["python", "manage.py", "processing_role_healthcheck", "--role", "embedding-worker"]
            initialDelaySeconds: 90
            periodSeconds: 60
            timeoutSeconds: 15
          resources:
            requests:
              cpu: "1000m"
              memory: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4000m"
              memory: "12Gi"
              nvidia.com/gpu: "1"
