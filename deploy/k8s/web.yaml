apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-web
  namespace: dms
  labels:
    app.kubernetes.io/name: dms-v2
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dms-v2
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-v2
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: ghcr.io/furidashidev/dms-v2:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: dms-config
            - secretRef:
                name: dms-secrets
          command:
            - sh
            - -c
            - >-
              python manage.py collectstatic --noinput &&
              python manage.py migrate --noinput &&
              gunicorn config.wsgi:application --bind 0.0.0.0:${PORT:-8000}
              --workers ${GUNICORN_WORKERS:-3}
              --timeout ${GUNICORN_TIMEOUT:-120}
              --access-logfile - --error-logfile -
          readinessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: dms-web
  namespace: dms
  labels:
    app.kubernetes.io/name: dms-v2
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dms-v2
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8000
      targetPort: http
