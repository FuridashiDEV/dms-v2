apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-ocr-worker
  namespace: dms
  labels:
    app.kubernetes.io/name: dms-v2
    app.kubernetes.io/component: ocr-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dms-v2
      app.kubernetes.io/component: ocr-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dms-v2
        app.kubernetes.io/component: ocr-worker
    spec:
      containers:
        - name: ocr-worker
          image: ghcr.io/furidashidev/dms-v2:latest
          envFrom:
            - configMapRef:
                name: dms-config
            - secretRef:
                name: dms-secrets
          command: ["python", "manage.py", "run_processing_role", "--role", "ocr-worker", "--limit", "10"]
          livenessProbe:
            exec:
              command: ["python", "manage.py", "processing_role_healthcheck", "--role", "ocr-worker"]
            initialDelaySeconds: 60
            periodSeconds: 60
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "3Gi"
---
